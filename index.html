<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Sentence Generator</title>
</head>
<body>
<div id="main"></div>
<input type="text" name="question" id="question" placeholder="question"><button id="send">send</button>


<script>



const box = document.getElementById("main")
const input = document.getElementById("question")
    var nouns = ["fish", "tree", "car", "skeleton", "movie"]
    var verbs = ["kick", "buy", "sell", "watch", "observe", "see", "eat", "drink", "damage", "destroy", "build", "purchase", "outdo", "kill", "vaporise", "draw", "sketch"]
    var mainnoun = nouns[Math.floor(Math.random() * nouns.length)]
    var mainverb = verbs[Math.floor(Math.random() * verbs.length)]
    var adjectives = ["big", "red", "green", "small"]
    var append = [", as soon as possible.", " every day.", " before tomorrow", " before the "+mainnoun+"s can stop you", ".", ".", ".", "."]

//input.addEventListener('input', function() {
//    regenerate()
//});
document.getElementById("send").addEventListener('click', function() {
    regenerate()

    input.value=""
});

function regenerate(){
    mainnoun = nouns[Math.floor(Math.random() * nouns.length)]

    nouns.forEach(element => {
        if (input.value.includes(element) && Math.random()<0.9){
            mainnoun = element
        }
    });
    mainverb = verbs[Math.floor(Math.random() * verbs.length)]

    verbs.forEach(element => {
        if (input.value.includes(element) && Math.random()<0.9){
            mainverb = element
        }
    });
append = [", as soon as possible.", " every day.", " before tomorrow", " before the "+mainnoun+"s can stop you", ".", ".", ".", "."]
    box.append("- ")
    box.append(input.value)
    box.append(document.createElement("br"))
    box.append(sentence())
    box.append(document.createElement("br"))
}


function sentence(){
    let hardcoded = 
[["hello", "hi"], ["friend", "nuh uh i'm your enemy"], ["why not", "because i said so, don't"]]

    let sentencebool = false
    let issentence = ""
    hardcoded.forEach(element => {
        if (input.value.includes(element[0]) && Math.random()<0.9){
            issentence = element[1]
            sentencebool=true
            console.log(element)
        }
    })


    let sentences = [
    "You should "+mainverb + " a " + random(adjectives)+" "+mainnoun+ random(append),
    "You should not "+mainverb + " a "+mainnoun+" today"

    ]
        if(sentencebool){
            return(issentence)}else{
    return(random(sentences))}
}

function noun(){
    return nouns[Math.floor(Math.random() * nouns.length)]
}
function verb(){
    return verbs[Math.floor(Math.random() * verbs.length)]
}
function random(list){
    return list[Math.floor(Math.random() * list.length)]
}
</script>

</body>
</html>
