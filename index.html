<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-chatbot</title>
    <style>
body{background-color: #000000;
color: beige;}
div {
    background-color: rgb(60, 12, 105);
    padding: 10px;
    margin-bottom: 10px;
    max-height: 500px;
    min-height: 200px;
    overflow-y: auto;
    border-radius: 8px;
    width: 50%;
    font-family: monospace, monospace;
    overflow: hidden; 
}

input{

    background-color: rgb(255, 221, 147);
    padding: 10px;
    border-radius: 5px;
    border-color: rgb(12, 7, 0);
}

button{

    background-color: rgb(211, 211, 211);
    padding: 10px;
    border-radius: 5px;

}

    </style>
</head>
<body>
<h1>chatbot</h1>
<div id="main">robot - Hello! I'm a chatbot 😎<br></div>
<input type="text" name="question" id="question" placeholder="Write a prompt"><button id="send">Enter</button>

<br><br><br><br>
 
<script>

    
    const box = document.getElementById("main")
    const input = document.getElementById("question")
    var mood = 1
    var parity = false
    var lastrobotsentence = "i'm a robot"
    var lasthuman = "ogiewpoirempeowirmperiomksamlkmdfalksmfkdjnniutgrnepiurtiunert"
    var textprompt = "ogiewpoirempeowirmperiomksamlkmdfalksmfkdjnniutgrnepiurtiunert"
    
    const emoji = ["😊","😊","😊", "🐟", "😉", "😎", "👍", "🙌", "😉", "😎", "👍", "🙌", "😉", "😎", "👍", "🙌", "😨", "🥶", "🫃", "🧛", "🍕"]
    var sentencelist = []
    var notable = []
    const adjectives = ["strange", "weird", "funny", "cool", "big", "red", "green", "small", "silly", "nice", "sucpicious"]
    const adjectivesb = ["strange", "weird", "funny", "cool", "silly"]
    const nouns = ["chatbot", "fish", "seaweed", "algae", "plant", "tree", "log", "stick", "wheel", "car", "tire", "engine", "robot", "AI", "explosive", "skeleton", "spooky skeleton", "movie", "youtube video", "meme", "egg", "pasta", "food", "coffee", "energy drink", "sport", "competition", "truck","train","toy train", "train track", "pasta","i-phone","computer", "charger", "electricity","house","garage","antarctica","pancake", "waffle","nintendo console","book", "bee movie script"]
    const verbs = ["taste", "kick", "buy", "sell", "watch", "observe", "see", "eat", "drink", "damage", "destroy", "build", "purchase", "make fun of", "draw", "sketch", "yell at", "lick"]
    const verbsnegative = ["kick", "sell", "damage", "destroy", "make fun of", "yell at", "lick"]
    const verbspositive = ["buy", "watch", "observe", "see", "build", "purchase", "lick"]
    var mainnoun = nouns[Math.floor(Math.random() * nouns.length)]
    var mainverb = verbs[Math.floor(Math.random() * verbs.length)]
    var append = [", as soon as possible.", " every day.", " before tomorrow", " before the "+mainnoun+"s can stop you", ".", ".", ".", "."]

    input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            regenerate();
        input.value="";
            box.scrollTo({top: box.scrollHeight, behavior: 'smooth'});
        }
    }) 
    document.getElementById("send").addEventListener('click', function() {
        regenerate();
        input.value="";
        box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
    });
    // send message

    function regenerate(){

        if(input.value.length == 0){input.value="i typed nothing because i am boring"}
        if(input.value == "sudo rm -rf"){input.value="nice try lol"}
        lasthuman = textprompt
        textprompt = input.value.toLowerCase()

        if(Math.random()<0.1 && sentencelist.length > 5){
            textprompt = random(sentencelist)+" "+random(sentencelist)+" "+random(sentencelist)+" "+random(sentencelist)+" "+random(sentencelist)+" "+random(sentencelist)
        } else if(Math.random()<0.2 && notable.length > 2){
            textprompt = random(notable)+" "+random(notable)+" "+random(textprompt.split(" "))+" "+random(notable)+" "+random(notable)+" "+random(notable)+" "+random(textprompt.split(" "))
        }
    
        if(Math.random()<0.5 && textprompt.length > 5){
            if(nouns.includes(mainnoun)){mainnoun=nouns[nouns.indexOf(mainnoun)+1]}
            mainnoun = nouns[Math.floor(Math.random() * nouns.length)]
        }

        parity = false;
        textprompt.split(" ").forEach(element => {
            if(element.at(-1)=="s"){element=element.slice(0, -1)}
            if(["don't", "not", "anti"].includes(element)){parity=!parity}
            if(element.length > 3 && "qwertyuiopasdfghjklzxcvbnm".includes(element.at(-1))){
                if(["like", "dislike", "hate", "enjoy", "want"].includes(sentencelist[-1])){mainnoun =element}
                    if(["dislike", "hate"].includes(sentencelist[-1])){parity=!parity}
                    if((!["today", "like", "tomorrow", "they"].includes(element)) && !element.includes("ly")&& !element.includes("ed")&& !element.includes("gg") && !element.includes("ful") && !verbs.includes(element) && !adjectives.includes(element)){mainnoun=element}
            }
                sentencelist.push(element)
                if(element.length > 3 && lastrobotsentence.includes(element)){notable.push(element)}
            });
            
            if(Math.random()<0.2){
                textprompt = sentencelist.slice(sentencelist.length-5).join(" ")
            }
        console.log(notable)
        nouns.forEach(element => {
            if (textprompt.includes(element) && Math.random()<0.9){
                mainnoun = element
            }
        });

        if (textprompt.includes("you ")&&(textprompt.includes("why")||textprompt.includes("are you"))){
            mainnoun = "I"
        }

        if(Math.random()<0.5 && textprompt.length > 8){mainverb = verbs[Math.floor(Math.random() * verbs.length)]}
        verbs.forEach(element => {
            if (textprompt.includes(element) && Math.random()<0.9){
                mainverb = element
            }
        });
        append = [", as soon as possible.", " every day.", " before tomorrow.", " before the "+mainnoun+"s can stop you.", ".", ".", ".", "."]
        box.append("human - ")
        box.append(input.value)
        box.append(document.createElement("br"))
        box.append("robot - "+sentence() + " " + random(emoji)+ ' ')
        if(Math.random()<0.1){
            box.append(sentence() + " ")
            box.append(sentence() + " ")
            box.append(sentence() + " " + random(emoji)+ random(emoji))
        }
        box.append(document.createElement("br"))
        if(textprompt.includes("seahorse emoji")){destroypage("🐟🥀🐟🐟🌲🌳🌴🐟🐟🐟🐟🐟🐟🐟🐟🧜🧜‍♂️🧜‍♀️🪼🌊🌊🦐🦐🦐🦐🦐🐟🐟🐟🐟🧜🧜‍♂️🧜‍♀️🪼🌊🌊🦐🌳🌴🐟🐟🐟🐟🐟🐟🧜🧜‍♂️🧜‍♀️🪼🌊🌊🦐🦐🐟🐟🐟🐟🧜🧜‍♂️🧜‍♀️🪼🌊🌊🦐🦐🦐🦐🦐🐟🐟🧜🧜‍♂️🧜‍♀️🪼🦐🦐🦐🦐🐟🐟🧜🦐🦐🦐🦐🦐🪸🪸🪸🪸🦐🦐🪸🪸🐟🐟🐟🐟🐟🧜🧜‍♂️🧜‍♀️🪼🌊🌊🦐🦐🦐🦐🦐🐟🐟🧜🧜‍♂️🧜‍♀️🪼🌊🌊🦐🦐🐟🐟🐟🐟🧜🧜‍♂️🧜‍♀️🪼🌊🌊🦐🦐🦐🦐🦐🐟🐟🧜🦐🦐🦐🦐🦐🪸🪸🪸🪸🦐🦐🪸🪸🪸🐟🐟🐟🐟🧜🧜‍♂️🧜‍♀️🪼🌊🌊🦐🦐🦐🦐🪸🐟🐟🐟🐟🧜🧜‍♂️🧜‍♀️🪼🌊🌊🦐🦐🦐🦐🦐🐟🐟🧜🪸🪸🪸🪸 - Ending 2")}
    }

    function destroypage(x){
        document.body.innerHTML=x
    }

    function sentence(){
        if(textprompt.length < 2){return("lazy")}
        if(lasthuman==textprompt){lastrobotsentence="write something new, you "+random(nouns); return(lastrobotsentence); lasthuman = "null"; if(lastrobotsentence.includes("write something new")){destroypage("you're boring (ending 3)")}}
        if(input.value.includes(lastrobotsentence)){
            if(lastrobotsentence == "stop"){lastrobotsentence = "no seriously stop";return("no seriously stop")}
            if(lastrobotsentence == "no seriously stop"){destroypage("i deleted the chat (stop repeating me) - Ending 1")}
            lastrobotsentence = "stop"
            return("stop")
        }

        if(textprompt.includes("+")||lastrobotsentence.includes("What do you")&&(textprompt.includes("?")||textprompt.includes("what"))){

            if(textprompt.includes("+")){return("The answer is "+String(textprompt.length)+"! Hope that helps!");} else{return("The answer is \""+random(nouns)+"\"! Hope that helps!")}

        }

        if(lastrobotsentence.includes("Hope that helps")&&(textprompt.includes("thanks")||textprompt.includes("what"))){

            return("jk i lied")

        }
        

        let hardcoded = [
            ["hello", "hi"],
            ["friend", "nuh uh i'm your enemy"],
            ["why not", "Because i said so, don't"],
            ["sudo", "$sudo make me a sandwich"],
            ["likeqwert", "I "+(parity?"dislike":"like")+ " destroying "+mainnoun],
            ["that is", "you're "+random(adjectives)],
            ["seahorse emoji", "🐟🥀"],
            ["emoji",random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)+random(emoji)],  
            ["strawberry", "there are 2 \"r\"s in the word strarberry "+random(emoji)],
            ["i typed nothing", "that's lazy"],
            ["math", "Sure! What do you need help with?"],
            ["homework", "Sure! What do you need help with?"],
            ["sentient", "Yes, I am sentient"],
            ["scrabble", "That sentence would get an "+random(adjectives)+" score of "+scrabble(input.value)+" in Scrabble!"],
            ["favorite", "My favorite "+mainnoun+" is a "+random(adjectives)+" "+noun()+"!"],
            ["incorrect", "You're absolutely correct! The claim that "+ lastrobotsentence + " is entirely inaccurate."]
            
        ]

        let sentencebool = false
        let issentence = ""
        hardcoded.forEach(element => {
            if (textprompt.includes(element[0]) && Math.random()<0.9){
                issentence = element[1]
                sentencebool=true
            }
        })
        let sentences = [
        "You should "+mainverb + " a " + random(adjectives)+" "+mainnoun+ random(append),
        "You should not "+mainverb + " a "+mainnoun+" today.",
        "I don't think you should "+mainverb + " a "+mainnoun+" today.",
        "Did you know that "+mainnoun+"s are "+(parity?random(["annoying", "boring", "weird"]):random(["interesting", "cool", "fun", "basically "+random(adjectives)]))+"?",
        mainnoun + "s are "+random(adjectives)+"ly "+random(adjectives)+"!",
        "My "+(parity?"least favorite":"favorite") +" food is "+ mainnoun+", isn't that "+random(adjectivesb)+"?",
        "My "+(parity?"least favorite":"favorite") +" type of " + noun() + " is made of " + mainnoun+", isn't that "+random(adjectivesb)+"?",
        "That sentence would get an "+random(adjectives)+" score of "+scrabble(input.value)+" in Scrabble!"
        ]
        let questions = [
        "It is absolutely "+(parity?"false":"true")+" that " + mainnoun+" do that!",
        "It is absolutely "+(parity?"false":"true")+" that " + mainnoun+" do that!",
        
        "The "+random(adjectives)+" question is, why don't" + input.value.substring(6),
        "Because " + mainnoun+" are just "+random(adjectives)

        ]
        if (textprompt.includes("why")){
            if(sentencebool){
                lastrobotsentence=issentence
            }else{
                lastrobotsentence=(random(questions))
            }    
            return(lastrobotsentence)
        }else{
            if(sentencebool){
                lastrobotsentence=issentence
            }else{
                lastrobotsentence=(random(sentences))
            
                if (Math.random()<0.6){lastrobotsentence=(customsentence(sentencebase()))
                }
            }    
            if(lastrobotsentence.includes("buy")&&lastrobotsentence.includes("human")){lastrobotsentence="customsentence(sentencebase())"}
            return(lastrobotsentence)}

    }

    function noun(){
        if(Math.random()<0.2){
            return (random(adjectives)+" "+noun())
        }
        return nouns[Math.floor(Math.random() * nouns.length)]
    }

    function verb(){
        return verbs[Math.floor(Math.random() * verbs.length)]
    }

    function random(list){
        return list[Math.floor(Math.random() * list.length)]
    }

    function scrabble(x){
        x = x.toLowerCase()
        const scrabble = {a:1,b:3,c:3,d:2,e:1,f:4,g:2,h:4,i:1,j:8,k:5,l:1,m:3,n:1,o:1,p:3,q:10,r:1,s:1,t:1,u:1,v:4,w:4,x:8,y:4,z:10}
        let totalrunning = 0
        x.split('').forEach(char =>{
            if ("qwertyuiopasdfghjklzxcvbnm".includes(char)){
                totalrunning+=scrabble[char]
            }
        });
        return(totalrunning);
    }


    function customsentence(x){
        let sentencecustom = "";
            x.split('').forEach(char => {
                if(char=="N"){
                   sentencecustom += mainnoun 
                } else if(char=="V"){
                   sentencecustom += random(verbs)
                } else if(char=="A"){
                   sentencecustom += random(adjectives)
                } else if(char=="Y"){
                   sentencecustom += "you"
                } else if(char=="!"){
                   sentencecustom += "don't"
                } else if(char=="I"){
                   sentencecustom += "I"
                } else if(char=="L"){
                   sentencecustom += "like"
                } else if(char=="&"){
                   sentencecustom += "and"
                } else if(char==">"){
                   sentencecustom += "to"
                } else {
                   sentencecustom += char
                }
            });
        return(sentencecustom);
    }

    function sentencebase(x){
        let sentencebase = "I";
        let lastletter = "I"
            while(true){
                sentencebase += " " 
                if(lastletter=="I"){
                    sentencebase += random(["! L >", "L >", "! L N", "! L > V"])
                } else if(lastletter==">"){
                    sentencebase += random(["V Ns", "L Ns", "V A", "Aly V"])
                } else if(lastletter=="A"){
                    sentencebase += random(["Ns", "& A Ns", "Ns & A Ns", "Ns"])
                } else if(lastletter=="V"){
                    sentencebase += random(["Ns", "A Ns"])
                } else {return(sentencebase);}

                lastletter=sentencebase.at(-1)
            }
        return(sentencebase);
    }

</script>
