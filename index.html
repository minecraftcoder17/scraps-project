<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Sentence Generator</title>
    <style>
div {
    border: 2px solid #333;
    padding: 10px;
    margin-bottom: 10px;
    max-height: 500px;
    overflow-y: auto;
    border-radius: 8px;
    width: 50%;
}
    </style>
</head>
<body>
<h1>chatbot</h1>
<div id="main">Hello! I'm a chatbot</div>
<input type="text" name="question" id="question" placeholder="question"><button id="send">send</button>


<script>



const box = document.getElementById("main")
const input = document.getElementById("question")
    var playerwords = ["null"]
    var adjectives = ["strange", "weird", "funny", "cool", "big", "red", "green", "small", "silly"]
    var adjectivesb = ["strange", "weird", "funny", "cool", "silly"]
    var nouns = ["fish", "seaweed", "algae", "plant", "tree", "log", "stick", "wheel", "car", "tire", "engine", "robot", "AI",  "skeleton", "movie","truck","train","pasta","i-phone","computer","house","garage","antarctica","pancake","nintendo console","book"]
    var verbs = ["kick", "buy", "sell", "watch", "observe", "see", "eat", "drink", "damage", "destroy", "build", "purchase", "make fun of", "kill", "draw", "sketch"]
    var mainnoun = nouns[Math.floor(Math.random() * nouns.length)]
    var mainverb = verbs[Math.floor(Math.random() * verbs.length)]
    var append = [", as soon as possible.", " every day.", " before tomorrow", " before the "+mainnoun+"s can stop you", ".", ".", ".", "."]

//input.addEventListener('input', function() {
//    regenerate()
//});

input.addEventListener('keydown', function(event) {
    console.log(1234)
    if (event.key === 'Enter') {
        regenerate()
    input.value=""
        box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });

}})
document.getElementById("send").addEventListener('click', function() {
    regenerate()

    input.value=""
    box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
});

function regenerate(){
    var textprompt = input.value.toLowerCase()

    console.log(textprompt);

    (textprompt.split(" ")).forEach(element => {
        if(element.length > 5 && "qwetyuiopafhjklzxcvbnm".includes(element.at(-1))){ // removed a few common adgective/verb endings
        playerwords = playerwords.concat(element)}
    });
    console.log(playerwords);
    if(Math.random()<0.5 && textprompt.length > 8){
        mainnoun = nouns[Math.floor(Math.random() * nouns.length)]
        if(Math.random()<0.5){mainnoun = random(playerwords)}

    }
    nouns.forEach(element => {
        if (textprompt.includes(element) && Math.random()<0.9){
            mainnoun = element
        }
    });
    if(Math.random()<0.5 && textprompt.length > 8){mainverb = verbs[Math.floor(Math.random() * verbs.length)]}

    verbs.forEach(element => {
        if (textprompt.includes(element) && Math.random()<0.9){
            mainverb = element
        }
    });
    append = [", as soon as possible.", " every day.", " before tomorrow.", " before the "+mainnoun+"s can stop you.", ".", ".", ".", "."]
    box.append("- ")
    box.append(input.value)
    box.append(document.createElement("br"))
    box.append(sentence() + " ")
    if(Math.random()<0.1){
        box.append(sentence() + " ")
        box.append(sentence() + " ")
        box.append(sentence() + " ")

    }
    box.append(document.createElement("br"))
}


function sentence(){
    let hardcoded = [
        ["hello", "hi"],
        ["friend", "nuh uh i'm your enemy"],
        ["why not", "Because i said so, don't"],
        ["sudo", "$sudo make me a sandwich"],
        ["like", "I like destroying "+mainnoun],
        ["that is", "you're "+random(adjectives)]
    ]

    let sentencebool = false
    let issentence = ""
    hardcoded.forEach(element => {
        if (input.value.includes(element[0]) && Math.random()<0.9){
            issentence = element[1]
            sentencebool=true
            console.log(element)
        }
    })


    let sentences = [
    "You should "+mainverb + " a " + random(adjectives)+" "+mainnoun+ random(append),
    "You should not "+mainverb + " a "+mainnoun+" today.",
    "I don't think you should "+mainverb + " a "+mainnoun+" today.",
    mainverb + "ing is fun!",
    "my favorite food is "+ mainnoun+", isn't that "+random(adjectivesb)+"?"

    ]
        if(sentencebool){
            return(issentence)}else{
    return(random(sentences))}
}

function noun(){
    if(Math.random()<0.2){
        return (random(adjectives)+" "+noun())
 
    }
    return nouns[Math.floor(Math.random() * nouns.length)]
}
function verb(){
    return verbs[Math.floor(Math.random() * verbs.length)]
}
function random(list){
    return list[Math.floor(Math.random() * list.length)]
}
</script>

</body>
</html>
